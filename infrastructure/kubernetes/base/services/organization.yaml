apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexops-organization
  namespace: cortexops-system
  labels:
    app: cortexops-organization
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortexops-organization
  template:
    metadata:
      labels:
        app: cortexops-organization
    spec:
      containers:
        - name: cortexops-organization
          image: cortexops/organization:latest
          command: ["python", "-m", "uvicorn", "apps.organization.org_main:app", "--host", "0.0.0.0", "--port", "8001"]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVICE_NAME
              value: "cortexops_organization"
          envFrom:
            - configMapRef:
                name: cortexops-common-config
            - secretRef:
                name: cortexops-common-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cortexops-organization
  namespace: cortexops-system
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: cortexops-organization