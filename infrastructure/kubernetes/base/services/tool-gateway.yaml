apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexops-tool-gateway
  namespace: cortexops-system
  labels:
    app: cortexops-tool-gateway
    tier: engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortexops-tool-gateway
  template:
    metadata:
      labels:
        app: cortexops-tool-gateway
    spec:
      containers:
        - name: cortexops-tool-gateway
          image: cortexops-tool-gateway:latest
          command: [ "python", "-m", "uvicorn", "apps.tool_gateway.tool_gateway_main:app", "--host", "0.0.0.0", "--port", "8004" ]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: SERVICE_NAME
              value: "cortexops_tool_gateway"
          envFrom:
            - configMapRef:
                name: cortexops-common-config
            - secretRef:
                name: cortexops-common-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8004
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cortexops-tool-gateway
  namespace: cortexops-system
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: cortexops-tool-gateway