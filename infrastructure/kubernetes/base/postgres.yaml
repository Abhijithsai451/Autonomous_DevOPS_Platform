apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infra-pgdb-pvc
  namespace: cortexops-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-pgdb
  namespace: cortexops-system
  labels:
    app: infra-pgdb
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-pgdb
  template:
    metadata:
      labels:
        app: infra-pgdb
    spec:
      containers:
        - name: infra-pgdb
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "default"
          envFrom:
            - configMapRef:
                name: cortexops-common-config
            - secretRef:
                name: cortexops-common-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: infra-pgdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: infra-pgdb
  namespace: cortexops-system
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: infra-pgdb