apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexops-organization
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cortexops-organization
    tier: core
    {{- include "cortexops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.organization.replicas }}
  selector:
    matchLabels:
      app: cortexops-organization
  template:
    metadata:
      labels:
        app: cortexops-organization
    spec:
      containers:
        - name: cortexops-organization
          image: "{{ .Values.global.imageRegistry }}/organization:{{ .Values.services.organization.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "uvicorn", "apps.organization.org_main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVICE_NAME
              value: "cortexops_organization"
          envFrom:
            - configMapRef:
                name: cortexops-common-config
            - secretRef:
                name: cortexops-common-secrets
          resources:
            {{- toYaml .Values.services.organization.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cortexops-organization
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: cortexops-organization