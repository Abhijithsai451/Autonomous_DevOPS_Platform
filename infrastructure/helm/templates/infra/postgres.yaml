{{- if .Values.infrastructure.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infra-postgres-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.infrastructure.postgres.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    app: infra-postgres
    tier: infrastructure
    {{- include "cortexops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-postgres
  template:
    metadata:
      labels:
        app: infra-postgres
    spec:
      containers:
        - name: infra-postgres
          image: {{ .Values.infrastructure.postgres.image }}
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: cortexops-common-config
            - secretRef:
                name: cortexops-common-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.infrastructure.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: infra-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: infra-postgres
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: infra-postgres
{{- end }}