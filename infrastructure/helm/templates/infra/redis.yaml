{{- if .Values.infrastructure.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: infra-redis
    tier: infrastructure
    {{- include "cortexops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-redis
  template:
    metadata:
      labels:
        app: infra-redis
    spec:
      containers:
        - name: infra-redis
          image: {{ .Values.infrastructure.redis.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: infra-redis
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: infra-redis
{{- end }}